[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Sleeper fantasy football API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sleeper-mcp = "sleeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
